<script>
(function () {
  var ROOT_IDS = ["chit-exp-root"];
  function getRoot() {
    for (var i = 0; i < ROOT_IDS.length; i++) {
      var el = document.getElementById(ROOT_IDS[i]);
      if (el) return el;
    }
    return null;
  }
  function setImp(el, props) {
    if (!el) return;
    Object.keys(props).forEach(function (k) {
      if (props[k] != null) el.style.setProperty(k, props[k], "important");
    });
  }
  function patchRecStyles(rec) {
    if (!rec) return;
    rec.querySelectorAll("style").forEach(function (s) {
      var t = s.textContent || "";
      if (t.indexOf("t396__artboard") < 0 && t.indexOf("tn-elem") < 0) return;
      var n = t
        .replace(/left:\s*calc\([^)]+\)/gi, "left:0")
        .replace(/width:\s*(?:1200|960|640|480|320)px/gi, "width:100%")
        .replace(/height:\s*35000px/gi, "height:auto")
        .replace(/height:\s*100vh/gi, "height:auto")
        .replace(/display:\s*table/gi, "display:block");
      if (n !== t) s.textContent = n;
    });
  }
  function syncTildaLayout() {
    var m = getRoot();
    if (!m) return;
    var rec = m.closest(".t-rec");
    patchRecStyles(rec);
    if (rec) {
      setImp(rec, {
        width: "100%",
        "max-width": "100%",
        height: "auto",
        "max-height": "none",
        overflow: "visible",
        "padding-top": "0",
        "margin-top": "0"
      });
    }
    [m.closest(".t396"), m.closest(".t396__artboard"), m.closest(".tn-elem"), m.closest(".tn-atom"), m.closest(".tn-atom__html"), m].forEach(function (el) {
      if (!el) return;
      setImp(el, {
        display: "block",
        position: "relative",
        left: "0",
        top: "0",
        width: "100%",
        "max-width": "100%",
        "min-width": "0",
        transform: "none",
        "min-height": "0",
        "max-height": "none",
        overflow: "visible",
        height: "auto"
      });
    });
    [".t396__carrier", ".t396__filter"].forEach(function (sel) {
      var el = rec && rec.querySelector(sel);
      if (!el) return;
      setImp(el, {
        height: "0",
        "max-height": "0",
        overflow: "hidden",
        position: "absolute",
        left: "0",
        top: "0",
        width: "100%",
        "pointer-events": "none"
      });
    });
    var h = Math.ceil(m.getBoundingClientRect().height);
    if (h > 0) {
      var ab = m.closest(".t396__artboard");
      if (ab) {
        setImp(ab, { height: h + "px" });
        ab.setAttribute("data-artboard-height", String(h));
      }
    }
  }
  window.chitSyncTildaLayout = syncTildaLayout;
  function hookT396() {
    if (window._chitPageT396Hook) return;
    var orig = window.t396_init;
    if (typeof orig !== "function") return;
    window._chitPageT396Hook = 1;
    window.t396_init = function () {
      var out = orig.apply(this, arguments);
      syncTildaLayout();
      setTimeout(syncTildaLayout, 50);
      return out;
    };
  }
  function addLink(rel, href, extra) {
    var l = document.createElement("link");
    l.rel = rel;
    l.href = href;
    if (extra) {
      Object.keys(extra).forEach(function (k) {
        l[k] = extra[k];
      });
    }
    document.head.appendChild(l);
  }
  function addScript(src) {
    var s = document.createElement("script");
    s.src = src;
    s.async = false;
    (document.body || document.documentElement).appendChild(s);
  }
  function addJsonLd(obj) {
    var s = document.createElement("script");
    s.type = "application/ld+json";
    s.text = JSON.stringify(obj);
    document.head.appendChild(s);
  }
  addLink("preconnect", "https://fonts.googleapis.com");
  addLink("preconnect", "https://fonts.gstatic.com", { crossOrigin: "anonymous" });
  addLink(
    "stylesheet",
    "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@500;600;700&display=swap"
  );
  addLink("stylesheet", "https://api.chitatelstvo.ru/static/expedition/expedition.css?v=20260919b");
  addScript("https://api.chitatelstvo.ru/static/expedition/expedition.js?v=20260919b");
  addJsonLd({
    "@context": "https://schema.org",
    "@type": "WebPage",
    name: "Читательская экспедиция",
    url: "https://chitatelstvo.ru/expedition",
    description:
      "Карта сказок народов России для детей 6–11 лет. Игровой маршрут и бесплатный вход на платформу школы «Читательство». Для семей и библиотек.",
    inLanguage: "ru",
    isPartOf: { "@type": "WebSite", name: "Читательство", url: "https://chitatelstvo.ru" },
    publisher: {
      "@type": "EducationalOrganization",
      name: "Читательство",
      url: "https://chitatelstvo.ru",
      email: "info@chitatelstvo.ru"
    },
    primaryImageOfPage: {
      "@type": "ImageObject",
      url: "https://api.chitatelstvo.ru/static/expedition/images/hero-map.png"
    },
    audience: { "@type": "PeopleAudience", suggestedMinAge: 6, suggestedMaxAge: 11 }
  });
  addJsonLd({
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    itemListElement: [
      { "@type": "ListItem", position: 1, name: "Читательство", item: "https://chitatelstvo.ru" },
      {
        "@type": "ListItem",
        position: 2,
        name: "Читательская экспедиция",
        item: "https://chitatelstvo.ru/expedition"
      }
    ]
  });
  syncTildaLayout();
  hookT396();
  setTimeout(syncTildaLayout, 80);
  setTimeout(syncTildaLayout, 300);
  setTimeout(syncTildaLayout, 1200);
  window.addEventListener("load", syncTildaLayout);
  var n = 0;
  var poll = setInterval(function () {
    syncTildaLayout();
    hookT396();
    if (++n > 80) clearInterval(poll);
  }, 250);
  var root = getRoot();
  if (root && window.ResizeObserver) {
    new ResizeObserver(syncTildaLayout).observe(root);
  }
})();
</script>
