<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Читательство — вход</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #faf6f0;
      color: #2c2416;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    .sub { color: #6b5d4d; margin: 0 0 24px; font-size: .95rem; }
    .url { font-family: ui-monospace, monospace; font-size: .85rem; }
    label { display: block; font-size: .9rem; color: #5a4a38; margin-bottom: 8px; }
    input[type=password] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 11px 16px;
      background: #5a4a38;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    .error {
      background: #fdecea;
      color: #a94442;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: .9rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Читательство</h1>
    <p class="sub">Админ-панель · <span class="url">api.chitatelstvo.ru/admin</span></p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <label for="password">Пароль</label>
      <input id="password" type="password" name="password" autofocus required>
      <button type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
