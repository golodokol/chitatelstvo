# api.chitatelstvo.ru — HTTP redirect + HTTPS (Let's Encrypt).
# Не копировать HTTP-only шаблон поверх этого файла: пропадёт 443.

server {
    listen 80;
    server_name api.chitatelstvo.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.chitatelstvo.ru;

    ssl_certificate /etc/letsencrypt/live/api.chitatelstvo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chitatelstvo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location /assets/ {
        alias /var/www/chitatelstvo-assets/;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        access_log off;
        types {
            text/css css;
            application/javascript js;
            application/json json;
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
            image/svg+xml svg;
            application/pdf pdf;
            font/woff2 woff2;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
