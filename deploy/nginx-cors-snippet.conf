# CORS для статики Tilda ↔ api.chitatelstvo.ru/assets/
# Вставить внутрь location /assets/ { ... } в HTTP и HTTPS server-блоках.
# После правки: nginx -t && systemctl reload nginx

add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Range" always;
add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
add_header Access-Control-Max-Age 86400 always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Range" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
}
